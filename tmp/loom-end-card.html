<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px;
    height: 1080px;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: 'Space Grotesk', 'Inter', -apple-system, sans-serif;
    position: relative;
    overflow: hidden;
  }
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(68,170,153,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(68,170,153,0.025) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  body::after {
    content: '';
    position: absolute;
    width: 900px;
    height: 900px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(68,170,153,0.05) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  .content {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 0 120px;
  }
  .logo-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 52px;
  }
  .logo-icon {
    width: 44px;
    height: 44px;
  }
  .logo-icon svg {
    width: 100%;
    height: 100%;
  }
  .logo-text {
    font-size: 18px;
    letter-spacing: 0.14em;
    color: #888;
    font-weight: 500;
  }
  .logo-text span { color: #44aa99; }
  .headline {
    font-size: 56px;
    font-weight: 700;
    color: #e8e8e8;
    line-height: 1.2;
    letter-spacing: -0.02em;
    margin-bottom: 20px;
  }
  .headline em {
    color: #44aa99;
    font-style: normal;
  }
  .sub {
    font-size: 24px;
    color: #666;
    font-weight: 400;
    line-height: 1.5;
    margin-bottom: 48px;
  }
  .cta-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }
  .cta-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #44aa99;
    color: #0a0a0a;
    font-size: 18px;
    font-weight: 700;
    padding: 16px 36px;
    border-radius: 8px;
    letter-spacing: 0.02em;
  }
  .cta-secondary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1.5px solid #333;
    color: #aaa;
    font-size: 16px;
    font-weight: 500;
    padding: 14px 28px;
    border-radius: 8px;
    letter-spacing: 0.02em;
  }
  .divider-line {
    width: 60px;
    height: 2px;
    background: #44aa99;
    margin: 0 auto 40px;
    opacity: 0.5;
  }
  .stats-row {
    display: flex;
    justify-content: center;
    gap: 64px;
    margin-top: 56px;
  }
  .stat {
    text-align: center;
  }
  .stat-num {
    font-size: 32px;
    font-weight: 800;
    color: #44aa99;
    line-height: 1;
  }
  .stat-label {
    font-size: 12px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 6px;
  }
  .bottom-bar {
    position: absolute;
    bottom: 40px;
    left: 100px;
    right: 100px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid #1a1a1a;
    padding-top: 16px;
    z-index: 1;
  }
  .url {
    font-size: 15px;
    color: #44aa99;
    letter-spacing: 0.05em;
    font-weight: 600;
  }
  .tagline {
    font-size: 13px;
    color: #444;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <div class="content">
    <div class="logo-row">
      <div class="logo-icon">
        <svg viewBox="0 0 16 16" fill="none" style="shape-rendering: crispEdges;">
          <rect x="1.5" y="1.5" width="13" height="13" stroke="#e8e8e8" stroke-width="1.5" fill="none" />
          <line x1="1.5" y1="8" x2="14.5" y2="8" stroke="#e8e8e8" stroke-width="1.5" />
          <line x1="8" y1="1.5" x2="8" y2="5.5" stroke="#e8e8e8" stroke-width="1.5" />
          <line x1="8" y1="10.5" x2="8" y2="14.5" stroke="#e8e8e8" stroke-width="1.5" />
        </svg>
      </div>
      <div class="logo-text">PERMISSION <span>/</span> PROTOCOL</div>
    </div>
    <div class="headline">No receipt. <em>No execution.</em></div>
    <div class="divider-line"></div>
    <div class="sub">Install in 5 minutes. Free for developers.</div>
    <div class="cta-row">
      <div class="cta-primary">→ &nbsp;permissionprotocol.com/developers/quickstart</div>
      <div class="cta-secondary">github.com/permission-protocol</div>
    </div>
    <div class="stats-row">
      <div class="stat">
        <div class="stat-num">&lt;200ms</div>
        <div class="stat-label">Median latency</div>
      </div>
      <div class="stat">
        <div class="stat-num">MIT</div>
        <div class="stat-label">Licensed</div>
      </div>
      <div class="stat">
        <div class="stat-num">Ed25519</div>
        <div class="stat-label">Signed receipts</div>
      </div>
    </div>
  </div>
  <div class="bottom-bar">
    <div class="url">permissionprotocol.com</div>
    <div class="tagline">The Signer of Record for AI Systems</div>
  </div>
</body>
</html>
