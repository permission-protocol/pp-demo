    must be disabled (false) to prevent race conditions and duplicate comments.
  - useSearchParams() does not react to native window.history.replaceState(). Must
    use router.replace() to clear query parameters and correctly update React state.
  - Gemini maxOutputTokens should be sized appropriately to the expected JSON payload
    (e.g., 1024 or 512) rather than maxed out (8192), to avoid wasting token buffers
    and latency.
