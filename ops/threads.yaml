- id: '1502383985878237214'
  title: Scout Alerts — Signal Scanner
  channel: scout-alers
  status: ACTIVE
  owner: charles-bot
  priority: high
  created_at: '2026-04-01'
  updated_at: '2026-05-08'
  expires_at: null
  blocked_reason: null
  blocked_until: null
  next_action: Add cron failure escalation; consolidate duplicate scanners; decide on Reddit/HN comment posting workflow
  resolution_artifact: null
  archived_at: null
  summary: >
    Automated daily signal scanner for Permission Protocol. Runs 1-3x daily (5:06am + 8am
    MDT crons), scanning HN/Reddit for AI agent deployment incidents, governance gaps, and
    competitor launches. Posts scored signals to #scout-alerts (threshold ≥4/8) and drafts
    outreach for hot signals (≥6/8). Has identified 30+ production incidents, 15+ competitor
    launches, and 10+ narrative hooks. Key recurring signals: Optio, Blitzy, APM, G0,
    Claude Code source leak. Two separate scanners (unified-signal-scan cron + scan-signals.sh)
    sometimes overlap. Cron has failed silently at least twice with no escalation. Generated
    Reddit/HN draft comments not known to be posted. Strong pattern of "gas pedal, no brakes"
    industry narrative consistently validated.
  open_tasks:
  - Add cron failure escalation (scanner failed silently Apr 20 + Apr 30)
  - Fix Brave API rate limit (429) hits that lose web search coverage
  - Consolidate duplicate scanners (unified-signal-scan vs scan-signals.sh)
  - Decide if Reddit/HN draft comments should actually be posted — workflow missing
  - Consider weekend coverage (Sat/Sun skip = 28% downtime)
  - Create signal-to-action pipeline for high-value targets (Blitzy, Optio creator, Cursor team)
  decisions:
  - Signal scan runs 1-3x daily, weekends skipped
  - Relevance threshold: 4/8 for channel posting, 6/8 for automated outreach drafts
  - Signals logged to pp-os/marketing/signals/YYYY-MM-DD.jsonl + HOT-SIGNAL.md
  - Bot drafts Reddit/HN comments in builder voice — no posting workflow confirmed
  - Scanner focus: AI coding agent deploys, agent security, agent governance, MCP ecosystem
  - Two scanner implementations exist (cron + shell script), sometimes produce overlapping results
