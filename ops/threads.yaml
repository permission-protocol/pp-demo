- id: '1500236856078504166'
  title: PP External Activation Goal
  channel: goals
  status: ARCHIVED
  owner: rod
  priority: high
  created_at: '2026-05-02'
  updated_at: '2026-05-08'
  expires_at: null
  blocked_reason: null
  blocked_until: null
  next_action: null
  resolution_artifact: Enforcement primitive hardened (PRs #393-#407 merged, pp-demo PR #47 smoke green). Goal paused pre-outreach by Rod on May 5.
  archived_at: '2026-05-08'
  summary: >
    7-day goal to achieve one real external PP activation. Hardened enforcement primitive
    (single-signature loop, GitHub App token scope fix, synchronous status posting, duplicate
    request dedupe, expired approval self-service recovery, install redirect origin fix).
    pp-demo PR #47 smoke: Deploy Gate blocked → one signature → receipt rcpt_dg_cmoq5qlx3000pd8j6cet7zlll → gate cleared.
    Outreach candidates identified (Kasper Junge/Ralphify, Boris Cherny, Andrej Karpathy,
    Mervin Praison, Faruk/mfyz) and activation package prepared. Rod paused goal on May 5
    before any outreach was sent. No external activation occurred.
  open_tasks: []
  decisions:
  - GitHub App token must use statuses:write only — broader token causes silent post-approval failure
  - Post-approval GitHub status posting must be synchronous, not deferred to background worker
  - Scope identity key (canonicalizeScope + buildScopeIdentityKey) must be used consistently
    across webhook helper and verify endpoint to prevent duplicate deploy requests
  - Carry-forward approval is a separate non-fatal path from commit status post (PR #396)
  - PP deploy primitive is host-agnostic — Render/Vercel/Fly are optional adapters, not core requirements
  - Expired approval self-service recovery shipped (PR #400)
  - Install redirect must use NEXT_PUBLIC_APP_URL / PP_APP_BASE_URL then x-forwarded-host, not request.url or NEXTAUTH_URL
  - External activation goal paused pre-outreach; activation package preserved for future use

